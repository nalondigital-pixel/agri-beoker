<!DOCTYPE html>
<html>
<head>
    <title>Agri Broker Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f3;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 360px;
        }

        h1 {
            margin-top: 0;
            color: #1f7a3f;
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            margin-bottom: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1f7a3f;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            background: #ffe4e4;
            color: #b42318;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 14px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Agri Broker</h1>
        <p>Admin Dashboard Login</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/dashboard/login">
            <input type="password" name="password" placeholder="Dashboard password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
