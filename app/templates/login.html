<!DOCTYPE html>
<html>
<head>
    <title>Agri Broker Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        h1 {
            color: #1f4d2b;
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1f4d2b;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Agri Broker</h1>
        <p>Admin Dashboard Login</p>

        {% if request.query_params.get("error") %}
            <div class="error">Wrong password.</div>
        {% endif %}

        <form method="post" action="/dashboard/login">
            <input type="password" name="password" placeholder="Enter dashboard password" required>
            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
